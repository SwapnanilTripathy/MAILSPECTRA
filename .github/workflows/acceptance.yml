# MAILSPECTRA acceptance workflow; generated by CodeRabbit coding agent.
name: Acceptance
on:
  push:
    branches: [main, coderabbit/open-frontend-files/81a0d3ed]
  pull_request:
    branches: [main, coderabbit/open-frontend-files/81a0d3ed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:////tmp/mailspectra-ci.db
      UPLOAD_DIR: /tmp/mailspectra-ci-uploads
      REPORTS_DIR: /tmp/mailspectra-ci-reports
      INTELLIGENCE_MODE: offline
      VERIFY_AUTHENTICATION_DNS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --tb=short
      - run: python -m scripts.generate_api_types && git diff --exit-code -- frontend/src/types/analysis.d.ts
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
