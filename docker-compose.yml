services:
  mailspectra:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY before starting}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8000"]}
      INTELLIGENCE_MODE: offline
      DATABASE_URL: sqlite+aiosqlite:////app/storage/mailspectra.db
      UPLOAD_DIR: /app/storage/uploads
      REPORTS_DIR: /app/storage/reports
    volumes:
      - mailspectra_storage:/app/storage
volumes:
  mailspectra_storage:
