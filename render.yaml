services:
  - type: web
    name: mailspectra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    autoDeploy: false
    healthCheckPath: /api/v1/ready
    # Explicit deployment migration; back up the persistent disk before upgrades.
    dockerCommand: sh -c 'python -m alembic upgrade head && python backend/run.py'
    disk:
      name: evidence
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: INTELLIGENCE_MODE
        value: offline
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/storage/mailspectra.db
      - key: UPLOAD_DIR
        value: /app/storage/uploads
      - key: REPORTS_DIR
        value: /app/storage/reports
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
