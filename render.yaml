services:
  - type: web
    name: mailspectra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /api/v1/ready
    # Run migrations at startup so the service's mounted evidence disk is available.
    # Back up PostgreSQL and the evidence disk together before upgrades.
    dockerCommand: sh -c 'python -m alembic upgrade head && python backend/run.py'
    disk:
      name: evidence
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: INTELLIGENCE_MODE
        value: offline
      - key: DATABASE_URL
        fromDatabase:
          name: mailspectra-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /app/storage/uploads
      - key: REPORTS_DIR
        value: /app/storage/reports
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: mailspectra-db
    databaseName: mailspectra
    user: mailspectra
    postgresMajorVersion: "17"
    plan: 0.1c-256mb
    region: singapore
    # Empty allowlist keeps database access on Render's private network.
    ipAllowList: []
