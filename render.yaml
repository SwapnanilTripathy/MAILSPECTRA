services:
  - type: web
    name: mailspectra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /api/v1/ready
    # Invoke one script instead of an inline shell expression; Render overrides Docker CMD.
    dockerCommand: sh scripts/start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: INTELLIGENCE_MODE
        value: offline
      - key: DATABASE_URL
        sync: false
      - key: EVIDENCE_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: mailspectra-evidence
      - key: STORAGE_TIMEOUT_SECONDS
        value: "30"
      - key: SHAP_ENABLED
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: UPLOAD_DIR
        value: /tmp/mailspectra/uploads
      - key: REPORTS_DIR
        value: /tmp/mailspectra/reports
      - key: CORS_ORIGINS
        value: "[]"
      - key: SECRET_KEY
        generateValue: true
