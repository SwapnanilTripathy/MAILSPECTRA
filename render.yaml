services:
  - type: web
    name: mailspectra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /api/v1/ready
    # Free instances have ephemeral filesystems. Uploaded evidence is temporary.
    dockerCommand: sh -c 'python -m alembic upgrade head && python backend/run.py'
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: INTELLIGENCE_MODE
        value: offline
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/mailspectra/uploads
      - key: REPORTS_DIR
        value: /tmp/mailspectra/reports
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
